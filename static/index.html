<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.O.U.L. — Sacrifice Outweighs Ultimate Leverage</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Roboto,Inter,Arial,sans-serif;background:#0b0e17;color:#e8ecf4;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 14px}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:radial-gradient(700px 320px at 15% -5%,rgba(127,119,221,.22),transparent 60%),
               radial-gradient(700px 320px at 85% 0%,rgba(29,158,117,.16),transparent 60%),
               radial-gradient(900px 500px at 50% 110%,rgba(212,83,126,.12),transparent 60%),#0b0e17}
  .wrap{width:100%;max-width:1060px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .orb{width:46px;height:46px;border-radius:50%;flex:none;
    background:conic-gradient(from 40deg,#7f77dd,#1d9e75,#e9c46a,#d4537e,#7f77dd);
    box-shadow:0 0 26px rgba(127,119,221,.55);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:21px;letter-spacing:.02em}
  h1 small{display:block;font-size:12px;font-weight:400;color:#9aa4bd;letter-spacing:.06em}
  #health{margin:10px 0 14px;font-size:12.5px;color:#9aa4bd;display:flex;gap:8px;flex-wrap:wrap}
  .pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:4px 12px}
  .pill b{color:#e9c46a;font-weight:600}
  main{display:grid;grid-template-columns:1fr 380px;gap:14px}
  @media(max-width:880px){main{grid-template-columns:1fr}}
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:14px;
        backdrop-filter:blur(10px);display:flex;flex-direction:column;overflow:hidden}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#9aa4bd;padding:12px 16px;
           border-bottom:1px solid rgba(255,255,255,.08)}
  #chat{height:460px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap}
  .u{align-self:flex-end;background:linear-gradient(135deg,#3c3489,#7f77dd);border-bottom-right-radius:4px}
  .a{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:4px}
  .sys{align-self:center;font-size:12px;color:#9aa4bd;background:rgba(233,196,106,.08);
       border:1px solid rgba(233,196,106,.25);border-radius:16px;padding:4px 14px}
  #trace{height:460px;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px}
  .t{border-left:3px solid #3a4358;padding:6px 10px;background:rgba(255,255,255,.03);border-radius:0 8px 8px 0}
  .t.thought{border-color:#7f77dd}.t.action{border-color:#e9c46a}.t.observation{border-color:#1d9e75}
  .t.answer{border-color:#d4537e}.t.error{border-color:#ff5d5d}.t.gate{border-color:#ff9f43;background:rgba(255,159,67,.07)}
  .t b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9aa4bd;display:block;margin-bottom:2px}
  .t pre{white-space:pre-wrap;font-family:inherit;font-size:13px;color:#d6deeb}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,.08)}
  input{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:10px;
        color:#e8ecf4;padding:11px 14px;font-size:14.5px;outline:none}
  input:focus{border-color:#7f77dd}
  button{background:linear-gradient(135deg,#3c3489,#7f77dd);border:none;color:#fff;border-radius:10px;
         padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .gatebox{border:1px solid rgba(255,159,67,.5);background:rgba(255,159,67,.08);border-radius:12px;padding:12px 14px;
           align-self:stretch;font-size:13.5px}
  .gatebox pre{white-space:pre-wrap;background:rgba(0,0,0,.35);border-radius:8px;padding:10px;margin:8px 0;font-size:13px}
  .gatebox .row{display:flex;gap:8px;margin-top:6px}
  .approve{background:linear-gradient(135deg,#085041,#1d9e75)}
  .deny{background:linear-gradient(135deg,#72243e,#d4537e)}
  .typing{color:#9aa4bd;font-size:13px;font-style:italic}
  footer{margin-top:12px;font-size:12px;color:#6b7690}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="orb"></div>
    <h1>S.O.U.L.<small>SACRIFICE OUTWEIGHS ULTIMATE LEVERAGE</small></h1>
  </header>
  <div id="health"><span class="pill">loading status…</span></div>
  <main>
    <div class="card"><h2>Chat</h2>
      <div id="chat"></div>
      <form id="f"><input id="in" autocomplete="off" placeholder='Try: "What is (17*23)+100?" or "Search Gmail for SCICO"'><button id="send">Send</button></form>
    </div>
    <div class="card"><h2>Thought → Action → Observation</h2><div id="trace"></div></div>
  </main>
  <footer>Single ReAct agent · sends stop and ask · character over raw power. · <a href="/board" style="color:#7f77dd">Agency board</a></footer>
</div>
<script>
const chat=document.getElementById('chat'),trace=document.getElementById('trace'),
      f=document.getElementById('f'),inp=document.getElementById('in'),btn=document.getElementById('send');
function addMsg(cls,txt){const d=document.createElement('div');d.className='msg '+cls;d.textContent=txt;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function addTrace(t){const d=document.createElement('div');d.className='t '+t.type;
  d.innerHTML='<b>'+({thought:'Thought',action:'Action · '+(t.tool||''),observation:'Observation · '+(t.tool||''),
  answer:'Answer',error:'Error',gate:'Approval needed'}[t.type]||t.type)+'</b>';
  const p=document.createElement('pre');p.textContent=t.text||'';d.appendChild(p);trace.appendChild(d);trace.scrollTop=trace.scrollHeight;}
function gateCard(p){const d=document.createElement('div');d.className='gatebox';
  d.innerHTML='<b>「 '+p.tool+' 」wants approval</b><pre></pre><div class="row"></div>';
  d.querySelector('pre').textContent=p.draft;
  const row=d.querySelector('.row'),ok=document.createElement('button'),no=document.createElement('button');
  ok.className='approve';ok.textContent='Approve & send';no.className='deny';no.textContent='Deny';
  ok.onclick=()=>{ok.disabled=no.disabled=true;decide(p.id,true,d);};
  no.onclick=()=>{ok.disabled=no.disabled=true;decide(p.id,false,d);};
  row.append(ok,no);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
async function decide(id,approve,card){card.querySelector('.row').innerHTML='<span class="typing">resuming…</span>';
  const r=await fetch('/api/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,approve})});
  handle(await r.json());}
function handle(res){(res.trace||[]).forEach(addTrace);
  if(res.status==='done')addMsg('a',res.answer);
  else if(res.status==='awaiting_approval')gateCard(res.pending);
  else addMsg('a','Error: '+res.answer);btn.disabled=false;inp.focus();}
f.onsubmit=async e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;inp.value='';btn.disabled=true;
  addMsg('u',v);addMsg('sys','S.O.U.L. is reasoning…');
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});
    chat.lastChild.remove();handle(await r.json());}
  catch(err){chat.lastChild.remove();addMsg('a','Server unreachable. Is app.py running?');btn.disabled=false;}};
fetch('/api/health').then(r=>r.json()).then(h=>{
  document.getElementById('health').innerHTML=
    '<span class="pill">brain <b>'+h.model+'</b> '+(h.ollama?'· online':'· OFFLINE')+'</span>'+
    '<span class="pill">whatsapp '+(h.whatsapp&&h.whatsapp.includes('true')?'<b>connected</b>':'· check daemon')+'</span>'+
    '<span class="pill">gmail '+(h.gmail_script?'<b>script ready</b>':'· missing')+'</span>';});
</script>
</body>
</html>
